<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon-Shipping-Project</title>
    <style>
        body{
            font-family: Arial;
        }
        .subscribe{
            background-color: rgb(0, 0, 0);
            border-radius: 50px;
            color: white;
            border: none;
            padding: 10px 15px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
        }
        .is-subscribed{
            background-color: rgb(240, 240, 240);
            color: black;
        }
        .cost-input{
            font-size: 15px;
            padding: 10px;
        }
        .calculate-button{
            background-color: green;
            color: white;
            border: none;
            font-size: 15px;
            padding: 12px 15px;
            cursor: pointer;
        }
        .js-error{
            color: red;
        }


    </style>
</head>
<body>
    <p>Youtube Subscribe Button</p>
    <button onclick="subscribe()
    " class="js-subscribe-button subscribe">Subscribe</button>

    <p>Amazon Shipping Calculator</p>
     <input placeholder="Cost of Order" class="js-cost-input cost-input" onkeydown="handleCostKeydown(event)
    ">
    <button onclick="
    calculateTotal()
    " class="calculate-button" >Calculate</button>
    <p class="js-totalcost"></p>

    <p class="js-error error-message"></p>

    <script>

        function handleCostKeydown(event){
        // console.log(event.key);
        if(event.key === 'Enter'){
                calculateTotal()
            }
        }

        function calculateTotal(){
        const inputEle = document.querySelector('.js-cost-input');
        let cost =Number( inputEle.value);
            console.log(typeof cost)

            document.querySelector('.js-totalcost').innerHTML=''
            document.querySelector('.error-message').innerHTML=''

            if(cost < 0){
                document.querySelector('.error-message').innerHTML = 'Error : Cannot be less than $0'
                return
            }

            if(cost <= 40){
                cost = cost + 10
            }
            document.querySelector('.js-totalcost')
            .innerHTML = `$${cost.toFixed(2)}`

        }

        function subscribe(){
            const buttonEle =  document.querySelector('.js-subscribe-button');

            if(buttonEle.innerText === 'Subscribe'){
            buttonEle.innerHTML = 'Subscribed'
            buttonEle.classList.add('is-subscribed')
            }else{
                buttonEle.innerHTML = 'Subscribe'
                buttonEle.classList.remove('is-subscribed');
            }

        }
    </script>
</body>
</html>
