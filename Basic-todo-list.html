<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ToDo List</title>
</head>
<body>
    <p>Todo List</p>
    <input type="text" class="js-input" placeholder="Enter Todo name">
    <button class="js-add-button"
    onclick="    
    addTodo()
    ">Add</button>

    <div class="js-todo-list"></div>

    <script >
const todoList = ['Learn a Language','Read Books','Watch Friends'];

renderTodoList()

function renderTodoList(){

let todoListHTML = '';

for(let i=0; i<todoList.length ; i++){
    const todo = todoList[i]
    const html = `<p>${todo}</p>`
    todoListHTML += html
}
 console.log(todoListHTML)

 document.querySelector('.js-todo-list')
 .innerHTML = todoListHTML

}

function addTodo(){

   const inputEle = document.querySelector('.js-input')
   const name = inputEle.value
   todoList.push(name)
   console.log(todoList)

   inputEle.value=" ";

   renderTodoList()
}

</script>
</body>
</html>
