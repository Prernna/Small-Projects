<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Rock Paper Scissor</title>
</head>
<body>
  <h2>Rock Paper Scissor</h2>
  <button onclick="playGame('rock')">Rock</button>
  <button onclick="playGame('paper')">Paper</button>
  <button onclick="playGame('scissor')">Scissor</button>

  <p class="js-score"></p>
  <p class="js-result"></p>
  <p class="js-moves"></p>

  <button onclick="
    score.wins = 0;
    score.losses = 0;
    score.ties = 0;
    localStorage.removeItem('score');
    updateScoreElement();
  ">Reset Score</button>

  <script>
    let score = JSON.parse(localStorage.getItem('score')) || {
      wins: 0,
      losses: 0,
      ties: 0
    };

    updateScoreElement();

    function playGame(playerMove) {
      let computerMove = ComputerMove();
      let result = '';

      if (playerMove === 'rock') {
        if (computerMove === 'rock') result = 'Tie';
        else if (computerMove === 'paper') result = 'You Lose';
        else result = 'You Won';
      } else if (playerMove === 'paper') {
        if (computerMove === 'rock') result = 'You Won';
        else if (computerMove === 'paper') result = 'Tie';
        else result = 'You Lose';
      } else if (playerMove === 'scissor') {
        if (computerMove === 'rock') result = 'You Lose';
        else if (computerMove === 'paper') result = 'You Won';
        else result = 'Tie';
      }

      if (result === 'You Won') {
        score.wins += 1;
      } else if (result === 'You Lose') {
        score.losses += 1;
      } else {
        score.ties += 1;
      }

      localStorage.setItem('score', JSON.stringify(score));

      updateScoreElement();

      document.querySelector('.js-result').innerHTML = result;
      document.querySelector('.js-moves').innerHTML =
        `You picked: ${playerMove}, Computer picked: ${computerMove}`;
    }

    function updateScoreElement() {
      document.querySelector('.js-score').innerHTML =
        `Wins: ${score.wins}, Losses: ${score.losses}, Ties: ${score.ties}`;
    }

    function ComputerMove() {
      const randomNumber = Math.random();
      if (randomNumber < 1 / 3) return 'rock';
      else if (randomNumber < 2 / 3) return 'paper';
      else return 'scissor';
    }
  </script>
</body>
</html>
