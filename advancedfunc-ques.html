//when start button gets clicked text should change to loading then after 2 seconds it should change to finished!
function updateButton(){
   const button = document.querySelector('.start-button')
   button.innerHTML='Loading...'
   setTimeout(function(){
      button.innerHTML='Finished!'
   },2000)
}

//create a button ' Add to Cart' when clicking on a button it should display a messege as added and then it should be removed after 2 seconds.
let setTime;
function added(){
   const messege = document.querySelector('.cart-messege')
   messege.innerText = 'Added' 
   clearTimeout(setTime)
    setTime =  setTimeout(function(){
      messege.innerText = " "
   },2000)
}
