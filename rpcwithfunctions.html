<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Rock Paper Scissor</h2>
    <button onclick="playGame('rock')">Rock</button>
    <button onclick="playGame('paper')">Paper</button>
    <button onclick="playGame('scissor')">Scissor</button>
    <button onclick="score.wins = 0;score.loss=0;score.ties=0;
    localStorage.removeItem('score')
    ">Reset Score</button>

    <script>

        let score = JSON.parse( localStorage.getItem('score'));
        
        if(score === null){
            score = {
                wins:0,
                loss:0,
                ties:0
            }
        }
        console.log(score);

        function playGame(playermove){

    let computerMove=ComputerMove();
    let result = '';

    if(playermove === 'rock'){
        if(computerMove === 'rock'){
            result='Tie'
        }else if(computerMove === 'paper'){
            result = 'You Loose'
        }else if(computerMove === 'scissor'){
            result = 'You Won'
        }
      
    }
    else if(playermove === 'paper'){
        if(computerMove === 'rock'){
            result='You Won'
        }else if(computerMove === 'paper'){
            result = 'Tie'
        }else if(computerMove === 'scissor'){
            result = 'You Loose'
        }
      
    }
    else if(playermove === 'scissor'){
        if(computerMove === 'rock'){
            result='You Loose'
        }else if(computerMove === 'paper'){
            result = 'You Won'
        }else if(computerMove === 'scissor'){
            result = 'Tie'
        } 
    }

    if(result ==='You Won'){
        score.wins += 1
    }else if(result ==='You Loose'){
        score.loss += 1
    }else if(result ==='Tie'){
        score.ties += 1;
    }

    localStorage.setItem('score',JSON.stringify(score))

    alert(`you picked ${playermove}, Computer picked ${computerMove} . Result is ${result}
wins : ${score.wins} , Losses : ${score.loss} , Ties : ${score.ties}`)

    function ComputerMove(){

    const randomNumber = Math.random()
    let computerMove='';

    if(randomNumber >=0 && randomNumber <= 1/3){
        computerMove = 'rock'
    }else if(randomNumber >=1/3 && randomNumber <= 2/3){
        computerMove='paper'
    }else{
        computerMove='scissor'
    }
    return computerMove;
    }

        }


    </script>
</body>
</html>
